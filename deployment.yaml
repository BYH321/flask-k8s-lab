apiVersion: apps/v1
kind: Deployment
metadata:
 name: flask-app
spec:
 replicas: 3
 selector:
  matchLabels:
   app: flask-app
 template:
  metadata:
   labels:
    app: flask-app
  spec:
   containers:
   - name: flask-app
     image: byh321/flask-app:0b5b1ff0063f90037f90237d128a510e4b34310c
     ports:
     - containerPort: 5000
     resources:
       requests:
         cpu: "100m"
         memory: "128Mi"
       limits:
         cpu: "200m"
         memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
 name: flask-service
spec:
 type: LoadBalancer
 selector:
  app: flask-app
 ports:
 - port: 80
   targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: flask-app-hpa
spec:
 scaleTargetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: flask-app
 minReplicas: 3 # 최소 3개 유지
 maxReplicas: 9 # 최대 9개까지 확장
 metrics:
 - type: Resource
   resource:
     name: cpu
     target:
       type: Utilization
       averageUtilization: 50 # CPU 사용률 50% 초과 시 확장
